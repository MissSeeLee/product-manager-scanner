<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a1020" />
  <title>AskMe AssetOps · Public Viewer</title>
  <link rel="icon" href="./askme-logo.png" />
  <link rel="stylesheet" href="./viewer.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="AskMe AssetOps Public Viewer">
        <img
          class="brand-logo"
          src="./askme-logo.png"
          alt="AskMe Solutions & Consultants Co., Ltd."
        />
      </a>

      <nav class="nav" aria-label="เมนู Public Viewer">
        <div class="nav-group">
          <span class="nav-section-label">PUBLIC VIEWER</span>

          <a class="nav-link" href="#overview" data-route="overview">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="4" rx="1.5"></rect>
                <rect x="14" y="11" width="7" height="10" rx="1.5"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              </svg>
            </span>
            <span>ภาพรวม</span>
          </a>

          <a class="nav-link" href="#assets" data-route="assets">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M7 9h10"></path>
                <path d="M7 13h6"></path>
                <path d="M17 13h.01"></path>
              </svg>
            </span>
            <span>อุปกรณ์</span>
          </a>

          <a class="nav-link" href="#history" data-route="history">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 12a8 8 0 1 0 2.34-5.66"></path>
                <path d="M4 4v5h5"></path>
                <path d="M12 8v4l3 2"></path>
              </svg>
            </span>
            <span>ประวัติการเคลื่อนไหว</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span class="system-indicator" aria-hidden="true"></span>
        <div>
          <strong>Public Read-only</strong>
          <span>เปิดดูข้อมูลที่อนุญาตเท่านั้น</span>
        </div>
      </div>
    </aside>

    <main class="app-main">
      <header class="topbar">
        <div class="topbar-copy">
          <span class="topbar-eyebrow">Asset Operations · Public</span>
          <h1 id="pageTitle" class="topbar-title">Public Asset Viewer</h1>
          <p id="pageSubtitle" class="topbar-subtitle">กำลังเตรียมข้อมูล…</p>
        </div>

        <div class="topbar-actions">
          <div class="readonly-badge" title="Public Viewer ไม่มีสิทธิ์แก้ไขข้อมูล">
            <span class="readonly-dot" aria-hidden="true"></span>
            <span id="connectionText">PUBLIC API</span>
          </div>

          <button id="refreshButton" class="button button-primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0 2 5"></path>
              <path d="M20 4v7h-7"></path>
            </svg>
            <span>รีเฟรช</span>
          </button>
        </div>
      </header>

      <div class="page-container">
        <main id="app" class="viewer-page" tabindex="-1" aria-live="polite"></main>

        <footer class="footer">
          <span>AskMe Solutions & Consultants Co., Ltd.</span>
          <span id="lastUpdated">—</span>
        </footer>
      </div>
    </main>

    <nav class="mobile-bottom-nav" aria-label="เมนู Public Viewer บนมือถือ">
      <a href="#overview" data-route="overview" class="mobile-nav-link">
        <span class="mobile-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="4" rx="1.5"></rect>
            <rect x="14" y="11" width="7" height="10" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </span>
        <span>ภาพรวม</span>
      </a>

      <a href="#assets" data-route="assets" class="mobile-nav-link">
        <span class="mobile-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M7 9h10"></path>
            <path d="M7 13h6"></path>
            <path d="M17 13h.01"></path>
          </svg>
        </span>
        <span>อุปกรณ์</span>
      </a>

      <a href="#history" data-route="history" class="mobile-nav-link">
        <span class="mobile-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 12a8 8 0 1 0 2.34-5.66"></path>
            <path d="M4 4v5h5"></path>
            <path d="M12 8v4l3 2"></path>
          </svg>
        </span>
        <span>ประวัติ</span>
      </a>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-header">
        <div>
          <span class="section-kicker">PUBLIC ASSET DETAIL</span>
          <h2 id="drawerTitle">รายละเอียดอุปกรณ์</h2>
        </div>
        <button id="closeDrawer" class="icon-button" type="button" aria-label="ปิดรายละเอียด">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>
      </div>
      <div id="detail" class="drawer-body"></div>
    </aside>
  </div>

  <script src="./viewer.js" defer></script>
</body>
</html>
